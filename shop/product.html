<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product — Nette's Corner</title>
  <link rel="icon" type="image/png" href="/images/NettesCorner.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--plum:#6D5A6D;--blush:#DDB6BB;--cream:#E9DED3;--ivory:#FAF7F2;--dark:#4A3F3A;--white:#fff;--soft:#7a6b65;--shadow:rgba(74,63,58,0.10)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:var(--ivory);color:var(--dark)}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    .container{max-width:1160px;margin:0 auto;padding:0 2rem}
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(250,247,242,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,182,187,0.3);transition:box-shadow 0.3s}
    .nav.scrolled{box-shadow:0 2px 20px var(--shadow)}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--dark)}
    .nav-logo span{color:var(--plum);font-style:italic}
    .nav-links{display:flex;gap:2.2rem;list-style:none}
    .nav-links a{font-size:0.78rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--soft);transition:color 0.2s}
    .nav-links a:hover{color:var(--plum)}
    .nav-cta{background:var(--plum);color:var(--white)!important;padding:0.55rem 1.3rem;border-radius:2px;font-size:0.72rem!important;font-weight:600!important;letter-spacing:0.14em!important}
    .nav-right{display:flex;align-items:center;gap:1rem}
    .cart-btn{position:relative;display:flex;align-items:center;gap:0.5rem;background:var(--dark);color:var(--white);border:none;padding:0.55rem 1.1rem;font-family:'Poppins',sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:background 0.2s}
    .cart-btn:hover{background:var(--plum)}
    .cart-badge{background:var(--plum);color:var(--white);border-radius:50%;width:18px;height:18px;font-size:0.65rem;font-weight:700;display:none;align-items:center;justify-content:center;margin-left:2px}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer}
    .hamburger span{width:24px;height:2px;background:var(--dark)}

    /* BREADCRUMB */
    .breadcrumb{padding:6rem 0 0;font-size:0.75rem;color:var(--soft)}
    .breadcrumb a{color:var(--soft);transition:color 0.2s}
    .breadcrumb a:hover{color:var(--plum)}
    .breadcrumb span{margin:0 0.4rem;opacity:0.5}

    /* PRODUCT LAYOUT */
    .product-section{padding:2rem 0 5rem}
    .product-layout{display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:start}

    /* GALLERY */
    .gallery{}
    .main-img{width:100%;aspect-ratio:1/1;overflow:hidden;background:var(--white);border:1px solid rgba(221,182,187,0.2)}
    .main-img img{width:100%;height:100%;object-fit:cover;transition:opacity 0.3s}
    .thumbs{display:flex;gap:0.7rem;margin-top:0.8rem;flex-wrap:wrap}
    .thumb{width:72px;height:72px;overflow:hidden;cursor:pointer;border:2px solid transparent;background:var(--white);transition:border-color 0.2s}
    .thumb:hover,.thumb.active{border-color:var(--plum)}
    .thumb img{width:100%;height:100%;object-fit:cover}

    /* PRODUCT INFO */
    .product-info{}
    .product-cat{font-size:0.62rem;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--plum);margin-bottom:0.7rem}
    .product-title{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;color:var(--dark);line-height:1.2;margin-bottom:1rem}
    .product-price{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--dark);margin-bottom:1.5rem}
    .product-desc{font-size:0.88rem;line-height:1.8;color:var(--soft);margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid rgba(221,182,187,0.3)}

    /* OPTIONS */
    .option-group{margin-bottom:1.5rem}
    .option-label{font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--dark);margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem}
    .option-selected{font-weight:400;color:var(--plum);text-transform:none;letter-spacing:0}

    /* COLOR SWATCHES */
    .color-swatches{display:flex;gap:0.6rem;flex-wrap:wrap}
    .color-swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.2s,transform 0.2s;position:relative}
    .color-swatch:hover{transform:scale(1.1)}
    .color-swatch.active{border-color:var(--plum)}
    .color-swatch.active::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:0.75rem;color:var(--white);text-shadow:0 1px 3px rgba(0,0,0,0.5)}

    /* SIZE SWATCHES */
    .size-swatches{display:flex;gap:0.5rem;flex-wrap:wrap}
    .size-swatch{min-width:44px;height:44px;padding:0 0.8rem;border:1.5px solid rgba(74,63,58,0.2);background:var(--white);font-family:'Poppins',sans-serif;font-size:0.78rem;font-weight:500;color:var(--dark);cursor:pointer;transition:border-color 0.2s,background 0.2s,color 0.2s;display:flex;align-items:center;justify-content:center}
    .size-swatch:hover{border-color:var(--plum);color:var(--plum)}
    .size-swatch.active{background:var(--plum);color:var(--white);border-color:var(--plum)}
    .size-swatch.unavailable{opacity:0.35;cursor:not-allowed;text-decoration:line-through}

    /* QTY */
    .qty-row{display:flex;align-items:center;gap:0;border:1.5px solid rgba(74,63,58,0.2);width:fit-content;margin-bottom:1.5rem}
    .qty-btn{width:40px;height:44px;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;transition:background 0.2s}
    .qty-btn:hover{background:var(--cream)}
    .qty-num{width:44px;height:44px;text-align:center;border:none;border-left:1.5px solid rgba(74,63,58,0.2);border-right:1.5px solid rgba(74,63,58,0.2);background:var(--white);font-family:'Poppins',sans-serif;font-size:0.9rem;font-weight:500;color:var(--dark)}

    /* ADD TO CART */
    .add-to-cart{width:100%;padding:1.1rem;background:var(--plum);color:var(--white);border:none;font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:background 0.25s,transform 0.2s;margin-bottom:0.8rem}
    .add-to-cart:hover{background:var(--dark);transform:translateY(-1px)}
    .add-to-cart:disabled{background:#ccc;cursor:not-allowed;transform:none}
    .view-cart-btn{width:100%;padding:1.1rem;background:transparent;color:var(--dark);border:2px solid rgba(74,63,58,0.25);font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:border-color 0.2s,color 0.2s;display:none}
    .view-cart-btn:hover{border-color:var(--plum);color:var(--plum)}

    /* TOAST */
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--dark);color:var(--white);padding:1rem 2rem;font-size:0.82rem;font-weight:500;letter-spacing:0.05em;transition:transform 0.4s;z-index:999;pointer-events:none}
    .toast.show{transform:translateX(-50%) translateY(0)}

    /* TRUST BADGES */
    .trust-badges{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid rgba(221,182,187,0.3)}
    .trust-badge{display:flex;align-items:center;gap:0.5rem;font-size:0.72rem;color:var(--soft)}
    .trust-badge-icon{font-size:1rem}

    /* RELATED */
    .related-section{padding:5rem 0;background:var(--cream)}
    .related-header{display:flex;align-items:center;gap:1.5rem;margin-bottom:2.5rem}
    .related-title{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--dark);white-space:nowrap}
    .related-title em{font-style:italic;color:var(--plum)}
    .related-line{flex:1;height:1px;background:rgba(221,182,187,0.4)}
    .related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5rem}
    .rel-card{background:var(--white);border:1px solid rgba(221,182,187,0.2);overflow:hidden;cursor:pointer;transition:transform 0.3s,box-shadow 0.3s}
    .rel-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px var(--shadow)}
    .rel-thumb{aspect-ratio:1/1;overflow:hidden}
    .rel-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s}
    .rel-card:hover .rel-thumb img{transform:scale(1.04)}
    .rel-body{padding:0.8rem 1rem 1rem}
    .rel-cat{font-size:0.58rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--plum);margin-bottom:0.3rem}
    .rel-title{font-family:'Playfair Display',serif;font-size:0.88rem;font-weight:600;color:var(--dark);line-height:1.3;margin-bottom:0.4rem}
    .rel-price{font-size:0.82rem;font-weight:600;color:var(--dark)}

    .footer{background:var(--dark);padding:4rem 0 2rem}
    .footer-bottom{display:flex;justify-content:center;padding-top:2rem;border-top:1px solid rgba(255,255,255,0.1)}
    .footer-copy{font-size:0.72rem;color:rgba(250,247,242,0.28)}
    .footer-heart{color:var(--blush)}

    @media(max-width:900px){.product-layout{grid-template-columns:1fr;gap:2rem}.related-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){
      .nav-links{display:none}
      .nav-links.open{display:flex;flex-direction:column;position:fixed;top:62px;left:0;right:0;background:var(--ivory);padding:1.5rem 2rem;border-bottom:1px solid rgba(221,182,187,0.3);z-index:99}
      .hamburger{display:flex}
      .related-grid{grid-template-columns:repeat(2,1fr)}
      .trust-badges{flex-direction:column;gap:0.8rem}
    }
  </style>
</head>
<body>

<nav class="nav" id="nav">
  <a href="../index.html" class="nav-logo">Nette<span>'s Corner</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="../blog/about.html">About</a></li>
    <li><a href="../blog/blog.html">Blog</a></li>
    <li><a href="index.html">Shop</a></li>
    <li><a href="../index.html#newsletter" class="nav-cta">Join Community</a></li>
  </ul>
  <div class="nav-right">
    <button class="cart-btn" onclick="window.location.href='cart.html'">
      🛍 Cart <span class="cart-badge" id="cartBadge"></span>
    </button>
    <div class="hamburger" id="hamburger" onclick="toggleNav()"><span></span><span></span><span></span></div>
  </div>
</nav>

<div class="container">
  <div class="breadcrumb">
    <a href="../index.html">Home</a><span>›</span>
    <a href="index.html">Shop</a><span>›</span>
    <a href="products.html">All Products</a><span>›</span>
    <span id="breadcrumbTitle">Product</span>
  </div>
</div>

<section class="product-section">
  <div class="container">
    <div id="productContainer">
      <p style="text-align:center;padding:4rem;color:var(--soft)">Loading product...</p>
    </div>
  </div>
</section>

<section class="related-section">
  <div class="container">
    <div class="related-header">
      <h2 class="related-title">You May Also <em>Like</em></h2>
      <div class="related-line"></div>
      <a href="products.html" style="font-size:0.72rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--plum);white-space:nowrap">All Products →</a>
    </div>
    <div id="relatedGrid" class="related-grid"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p class="footer-copy">© 2025 Nette's Corner. Made with <span class="footer-heart">♥</span></p>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script>
const nav=document.getElementById('nav');
window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',window.scrollY>40));
function toggleNav(){document.getElementById('navLinks').classList.toggle('open')}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

function updateCartBadge(){
  const cart=JSON.parse(localStorage.getItem('nc_cart')||'[]');
  const total=cart.reduce((s,i)=>s+i.qty,0);
  const badge=document.getElementById('cartBadge');
  if(total>0){badge.textContent=total;badge.style.display='flex'}else{badge.style.display='none'}
}
updateCartBadge();

const COLOR_MAP={
  'black':'#2c2c2c','white':'#f5f5f5','navy':'#1a2744','red':'#c0392b',
  'royal blue':'#2554c7','forest green':'#2d6a4f','heather gray':'#b0b0b0',
  'sport grey':'#9e9e9e','ash':'#d5d5d5','dark heather':'#555',
  'light blue':'#a8d5e2','purple':'#6b2d8b','maroon':'#800000',
  'gold':'#c9a83c','orange':'#e67e22','green':'#27ae60','pink':'#e91e8c',
  'natural':'#f5e6c8','cream':'#fdf8f0','tan':'#d2b48c','brown':'#8b4513',
  'charcoal':'#3d3d3d','sand':'#e8d5b0','olive':'#6b7c2d','slate':'#708090',
  'athletic heather':'#c8c8c8','indigo':'#3f51b5','teal':'#008080',
  'cardinal':'#9e1b32','kelly green':'#4cbb17','antique white':'#faebd7',
  'light pink':'#ffb6c1','coral':'#ff6b6b','mint':'#98d8c8'
};
function getColorHex(name){
  if(!name)return'#ccc';
  const l=name.toLowerCase();
  for(const[k,v]of Object.entries(COLOR_MAP)){if(l.includes(k))return v}
  return'#ccc';
}
function getCategory(title){
  const t=title.toLowerCase();
  if(t.includes('mug')||t.includes('cup'))return'Mugs';
  if(t.includes('tote')||t.includes('bag'))return'Bags';
  if(t.includes('hoodie'))return'Hoodies';
  if(t.includes('tank'))return'Tanks';
  if(t.includes('poster')||t.includes('print'))return'Prints';
  return'T-Shirts';
}

let product=null;
let allProducts=[];
let selectedColor=null;
let selectedSize=null;
let selectedVariantId=null;
let qty=1;

function getVariant(){
  if(!product)return null;
  // Try to match by selected color and size option values
  return product.variants.find(v=>{
    const opts=v.options||{};
    const vals=Object.values(opts).map(x=>String(x));
    const colorMatch=!selectedColor||vals.some(v=>String(v)===String(selectedColor));
    const sizeMatch=!selectedSize||vals.some(v=>String(v)===String(selectedSize));
    return colorMatch&&sizeMatch&&v.is_available!==false;
  })||product.variants.find(v=>v.is_available!==false)||product.variants[0];
}

function updatePrice(){
  const v=getVariant();
  if(v){
    selectedVariantId=v.id;
    document.getElementById('priceDisplay').textContent='$'+v.price.toFixed(2);
  }
}

function setMainImage(src){
  const img=document.getElementById('mainImg');
  img.style.opacity='0';
  setTimeout(()=>{img.src=src;img.style.opacity='1'},200);
  document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
}

function buildGallery(images){
  const thumbsEl=document.getElementById('thumbsContainer');
  thumbsEl.innerHTML='';
  images.slice(0,8).forEach((img,i)=>{
    const el=document.createElement('div');
    el.className='thumb'+(i===0?' active':'');
    el.innerHTML=`<img src="${img.src}" alt="Product view ${i+1}" loading="lazy"/>`;
    el.onclick=()=>{
      setMainImage(img.src);
      document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
      el.classList.add('active');
    };
    thumbsEl.appendChild(el);
  });
}

// When color selected, try to find matching image
function onColorSelect(colorId,colorName,el){
  selectedColor=colorId;
  selectedSize=null; // reset size
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('selectedColorName').textContent=colorName;
  // Try to find image matching this color's variant IDs
  const variant=product.variants.find(v=>{
    const vals=Object.values(v.options||{}).map(x=>String(x));
    return vals.includes(String(colorId))&&v.is_available!==false;
  });
  if(variant){
    selectedVariantId=variant.id;
    const matchImg=product.images.find(img=>img.variant_ids&&img.variant_ids.includes(variant.id));
    if(matchImg)setMainImage(matchImg.src);
  }
  // Rebuild size options for this color
  buildSizeOptions();
  updatePrice();
}

function buildSizeOptions(){
  const sizeOpt=product.options?.find(o=>o.name.toLowerCase().includes('size'));
  if(!sizeOpt)return;
  const el=document.getElementById('sizeSwatches');
  if(!el)return;
  el.innerHTML='';
  sizeOpt.values.forEach(sv=>{
    // Check if this size is available for selected color
    const available=product.variants.some(v=>{
      const vals=Object.values(v.options||{}).map(x=>String(x));
      const colorOk=!selectedColor||vals.includes(String(selectedColor));
      return colorOk&&vals.includes(String(sv.id))&&v.is_available!==false;
    });
    const btn=document.createElement('button');
    btn.className='size-swatch'+(available?'':' unavailable');
    btn.textContent=sv.title;
    btn.disabled=!available;
    btn.onclick=()=>{
      if(!available)return;
      selectedSize=sv.id;
      document.querySelectorAll('.size-swatch').forEach(s=>s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('selectedSizeName').textContent=sv.title;
      updatePrice();
    };
    el.appendChild(btn);
  });
}

function buildProduct(p){
  product=p;
  document.title=`${p.title} — Nette's Corner`;
  document.getElementById('breadcrumbTitle').textContent=p.title;

  const colorOpt=p.options?.find(o=>o.name.toLowerCase().includes('color')||o.name.toLowerCase().includes('colour'));
  const sizeOpt=p.options?.find(o=>o.name.toLowerCase().includes('size'));

  // Build color swatches HTML
  let colorHTML='';
  if(colorOpt){
    const seen=new Set();
    const swatches=colorOpt.values.filter(v=>{
      const hex=getColorHex(v.title);
      if(seen.has(hex))return false;
      seen.add(hex);return true;
    }).map(v=>`
      <div class="color-swatch" 
           style="background:${getColorHex(v.title)};${getColorHex(v.title)==='#f5f5f5'?'border-color:#ccc':''}" 
           title="${v.title}"
           onclick="onColorSelect('${v.id}','${v.title}',this)">
      </div>`).join('');
    colorHTML=`
      <div class="option-group">
        <div class="option-label">Colour <span class="option-selected" id="selectedColorName">— select one</span></div>
        <div class="color-swatches">${swatches}</div>
      </div>`;
  }

  // Build size HTML (placeholder, rebuilt on color select)
  let sizeHTML='';
  if(sizeOpt){
    sizeHTML=`
      <div class="option-group">
        <div class="option-label">Size <span class="option-selected" id="selectedSizeName">— select one</span></div>
        <div class="size-swatches" id="sizeSwatches"></div>
      </div>`;
  }

  const firstPrice=p.variants[0]?.price||0;

  document.getElementById('productContainer').innerHTML=`
    <div class="product-layout">
      <div class="gallery">
        <div class="main-img">
          <img id="mainImg" src="${p.image}" alt="${p.title}" style="transition:opacity 0.3s"/>
        </div>
        <div class="thumbs" id="thumbsContainer"></div>
      </div>
      <div class="product-info">
        <div class="product-cat">${getCategory(p.title)}</div>
        <h1 class="product-title">${p.title}</h1>
        <div class="product-price" id="priceDisplay">$${firstPrice.toFixed(2)}</div>
        <p class="product-desc">${p.description||"A faith-inspired piece from Nette's Corner, designed to carry meaning every time you wear it."}</p>
        ${colorHTML}
        ${sizeHTML}
        <div class="option-group">
          <div class="option-label">Quantity</div>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <input class="qty-num" id="qtyInput" type="number" value="1" min="1" max="10" readonly/>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
        </div>
        <button class="add-to-cart" id="addToCartBtn" onclick="addToCart()">Add to Cart</button>
        <button class="view-cart-btn" id="viewCartBtn" onclick="window.location.href='cart.html'">View Cart →</button>
        <div class="trust-badges">
          <div class="trust-badge"><span class="trust-badge-icon">🚚</span> Ships worldwide</div>
          <div class="trust-badge"><span class="trust-badge-icon">✦</span> Print on demand — made just for you</div>
          <div class="trust-badge"><span class="trust-badge-icon">🔒</span> Secure PayPal checkout</div>
        </div>
      </div>
    </div>`;

  buildGallery(p.images);
  if(sizeOpt) buildSizeOptions();
  // Auto-select first color
  if(colorOpt&&colorOpt.values.length){
    const firstSwatch=document.querySelector('.color-swatch');
    if(firstSwatch) onColorSelect(colorOpt.values[0].id,colorOpt.values[0].title,firstSwatch);
  }
  updatePrice();
}

function changeQty(d){
  qty=Math.max(1,Math.min(10,qty+d));
  document.getElementById('qtyInput').value=qty;
}

function addToCart(){
  const v=getVariant();
  if(!v){showToast('Please select options first');return}
  const cart=JSON.parse(localStorage.getItem('nc_cart')||'[]');
  const existing=cart.find(i=>i.variantId===v.id&&i.productId===product.id);
  if(existing){existing.qty+=qty}else{
    cart.push({
      productId:product.id,
      variantId:v.id,
      title:product.title,
      variantTitle:v.title,
      price:v.price,
      image:product.image,
      qty:qty
    });
  }
  localStorage.setItem('nc_cart',JSON.stringify(cart));
  updateCartBadge();
  showToast('✓ Added to cart!');
  document.getElementById('viewCartBtn').style.display='block';
}

function buildRelated(currentId,products){
  const related=products.filter(p=>p.id!==currentId).slice(0,4);
  document.getElementById('relatedGrid').innerHTML=related.map(p=>`
    <div class="rel-card" onclick="window.location.href='product.html?id=${p.id}'">
      <div class="rel-thumb"><img src="${p.image}" alt="${p.title}" loading="lazy"/></div>
      <div class="rel-body">
        <div class="rel-cat">${getCategory(p.title)}</div>
        <div class="rel-title">${p.title}</div>
        <div class="rel-price">from $${p.price.toFixed(2)}</div>
      </div>
    </div>`).join('');
}

async function init(){
  const params=new URLSearchParams(window.location.search);
  const id=params.get('id');
  if(!id){window.location.href='products.html';return}
  try{
    const res=await fetch('/.netlify/functions/products');
    allProducts=await res.json();
    const p=allProducts.find(x=>x.id===id);
    if(!p){document.getElementById('productContainer').innerHTML='<p style="text-align:center;padding:4rem">Product not found. <a href="products.html" style="color:var(--plum)">Back to shop</a></p>';return}
    buildProduct(p);
    buildRelated(id,allProducts);
  }catch(e){
    document.getElementById('productContainer').innerHTML='<p style="text-align:center;padding:4rem;color:var(--soft)">Could not load product. Please try again.</p>';
  }
}
init();
</script>
</body>
</html>
