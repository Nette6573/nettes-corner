<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Nette's Corner</title>

<style>
:root{
--plum:#6D5A6D;
--blush:#DDB6BB;
--ivory:#FAF7F2;
--dark:#4A3F3A;
--white:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:var(--ivory);color:var(--dark)}

.header{
padding:20px;
background:white;
box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.product-layout{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
}

.gallery img{
width:100%;
border-radius:12px;
background:white;
}

.title{
font-size:2rem;
margin-bottom:15px;
}

.price{
font-size:2rem;
font-weight:bold;
color:var(--plum);
margin-bottom:20px;
}

.description{
line-height:1.8;
margin-bottom:25px;
}

.selector{
margin-bottom:20px;
}

.selector label{
display:block;
font-weight:bold;
margin-bottom:8px;
}

select,input[type=number]{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:8px;
}

.btn{
background:var(--plum);
color:white;
border:none;
padding:15px 25px;
border-radius:8px;
cursor:pointer;
font-size:1rem;
width:100%;
}

.btn:hover{
opacity:.9;
}

.related{
margin-top:80px;
}

.related-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:25px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
}

.card a{
display:inline-block;
margin-top:10px;
color:var(--plum);
font-weight:bold;
text-decoration:none;
}

@media(max-width:768px){
.product-layout{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<div class="header">
<h2>Nette's Corner Shop</h2>
</div>

<div class="container">

<div id="productContainer">
Loading product...
</div>

<div class="related">
<h2>You May Also Like</h2>
<div id="relatedProducts" class="related-grid"></div>
</div>

</div>

<script>

let allProducts=[];

async function loadProduct(){

const params=new URLSearchParams(window.location.search);
const productId=params.get('id');

const response=await fetch('/.netlify/functions/products');
allProducts=await response.json();

const product=allProducts.find(p=>p.id===productId);

if(!product){
document.getElementById('productContainer').innerHTML=
'<h2>Product not found</h2>';
return;
}

let optionsHtml = "";

if(product.options){

    product.options.forEach(option => {

        optionsHtml += `
            <div class="selector">

                <label>${option.name}</label>

                <select id="option-${option.name}">

                    ${option.values.map(value => `

                        <option value="${value.id}">
                            ${value.title}
                        </option>

                    `).join("")}

                </select>

            </div>
        `;
    });
}

document.getElementById('productContainer').innerHTML=`

<div class="product-layout">

<div class="gallery">
<img src="${product.image}" alt="${product.title}">
</div>

<div>

<h1 class="title">${product.title}</h1>

<div class="price">$${product.price.toFixed(2)}</div>

<p class="description">
${product.description ? product.description : "Faith-inspired product from Nette's Corner."}
</p>

<div id="productOptions">

    ${optionsHtml}

</div>

<div class="selector">
<label>Quantity</label>
<input id="qty" type="number" value="1" min="1">
</div>

<button class="btn" onclick="addToCart('${product.id}')">
Add To Cart
</button>

</div>

</div>
`;

loadRelated(productId);

}

function addToCart(productId){

const qty=parseInt(document.getElementById('qty').value)||1;

const selectedOptions = {};

document
.querySelectorAll('#productOptions select')
.forEach(select => {

    selectedOptions[select.id] = select.value;

});

const cart=JSON.parse(localStorage.getItem('cart')||'[]');

const existing=cart.find(item=>item.id===productId);

if(existing){

    existing.qty += qty;

}else{

    cart.push({
        id: productId,
        qty: qty,
        options: selectedOptions
    });

}

localStorage.setItem('cart',JSON.stringify(cart));

alert('Added to cart!');
}

function loadRelated(currentId){

const related=allProducts
.filter(p=>p.id!==currentId)
.slice(0,4);

const container=document.getElementById('relatedProducts');

related.forEach(product=>{

container.innerHTML+=`

<div class="card">

<img src="${product.image}" alt="${product.title}">

<h4>${product.title}</h4>

<p>$${product.price.toFixed(2)}</p>

<a href="/shop/product.html?id=${product.id}">
View Product
</a>

</div>

`;

});
}

loadProduct();

</script>

</body>
</html>
