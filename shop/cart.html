<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart — Nette's Corner</title>
  <link rel="icon" type="image/png" href="/images/NettesCorner.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root{--plum:#6D5A6D;--blush:#DDB6BB;--cream:#E9DED3;--ivory:#FAF7F2;--dark:#4A3F3A;--white:#fff;--soft:#7a6b65;--shadow:rgba(74,63,58,0.10)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:var(--ivory);color:var(--dark)}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    .container{max-width:1160px;margin:0 auto;padding:0 2rem}
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.2rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(250,247,242,0.92);backdrop-filter:blur(12px);border-bottom:1px solid rgba(221,182,187,0.3);transition:box-shadow 0.3s}
    .nav.scrolled{box-shadow:0 2px 20px var(--shadow)}
    .nav-logo{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:700;color:var(--dark)}
    .nav-logo span{color:var(--plum);font-style:italic}
    .nav-links{display:flex;gap:2.2rem;list-style:none}
    .nav-links a{font-size:0.78rem;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--soft);transition:color 0.2s}
    .nav-links a:hover{color:var(--plum)}
    .nav-cta{background:var(--plum);color:var(--white)!important;padding:0.55rem 1.3rem;border-radius:2px;font-size:0.72rem!important;font-weight:600!important;letter-spacing:0.14em!important}
    .hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer}
    .hamburger span{width:24px;height:2px;background:var(--dark)}

    /* PAGE */
    .page-header{padding:8rem 0 3rem;text-align:center}
    .page-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3rem);font-weight:700;color:var(--dark)}
    .page-title em{font-style:italic;color:var(--plum)}
    .page-sub{font-size:0.9rem;color:var(--soft);margin-top:0.5rem}

    /* LAYOUT */
    .cart-section{padding:0 0 6rem}
    .cart-layout{display:grid;grid-template-columns:1fr 360px;gap:3rem;align-items:start}

    /* CART ITEMS */
    .cart-items{}
    .cart-item{display:grid;grid-template-columns:90px 1fr auto;gap:1.2rem;align-items:start;padding:1.5rem 0;border-bottom:1px solid rgba(221,182,187,0.25)}
    .cart-item:last-child{border-bottom:none}
    .item-img{width:90px;height:90px;overflow:hidden;border:1px solid rgba(221,182,187,0.2);flex-shrink:0}
    .item-img img{width:100%;height:100%;object-fit:cover}
    .item-details{}
    .item-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;color:var(--dark);margin-bottom:0.25rem;line-height:1.3}
    .item-variant{font-size:0.75rem;color:var(--soft);margin-bottom:0.8rem}
    .item-qty-row{display:flex;align-items:center;gap:0;border:1.5px solid rgba(74,63,58,0.15);width:fit-content}
    .qty-btn{width:32px;height:32px;background:none;border:none;font-size:1rem;cursor:pointer;color:var(--dark);display:flex;align-items:center;justify-content:center;transition:background 0.2s}
    .qty-btn:hover{background:var(--cream)}
    .qty-num{width:36px;height:32px;text-align:center;border:none;border-left:1.5px solid rgba(74,63,58,0.15);border-right:1.5px solid rgba(74,63,58,0.15);background:var(--white);font-family:'Poppins',sans-serif;font-size:0.82rem;font-weight:500;color:var(--dark)}
    .item-price-col{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:0.8rem}
    .item-price{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700;color:var(--dark)}
    .remove-btn{background:none;border:none;font-size:0.7rem;color:var(--soft);cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:color 0.2s}
    .remove-btn:hover{color:#c0392b}

    /* EMPTY */
    .empty-cart{text-align:center;padding:4rem 2rem;background:var(--white);border:1px solid rgba(221,182,187,0.2)}
    .empty-icon{font-size:3rem;margin-bottom:1rem}
    .empty-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--dark);margin-bottom:0.5rem}
    .empty-sub{font-size:0.85rem;color:var(--soft);margin-bottom:1.5rem}
    .btn-primary{display:inline-block;background:var(--plum);color:var(--white);padding:0.9rem 2rem;font-family:'Poppins',sans-serif;font-size:0.72rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;border:none;cursor:pointer;transition:background 0.2s}
    .btn-primary:hover{background:var(--dark)}

    /* ORDER SUMMARY */
    .order-summary{background:var(--white);border:1px solid rgba(221,182,187,0.2);padding:2rem;position:sticky;top:100px}
    .summary-title{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;color:var(--dark);margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(221,182,187,0.25)}
    .summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;font-size:0.85rem;color:var(--soft)}
    .summary-row.total{margin-top:1rem;padding-top:1rem;border-top:1px solid rgba(221,182,187,0.25);font-size:1rem;color:var(--dark);font-weight:600}
    .summary-row.total .label{font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:700}
    .summary-row.total .value{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--plum)}
    .shipping-note{font-size:0.72rem;color:var(--soft);margin-bottom:1.5rem;padding:0.8rem;background:var(--ivory);text-align:center;line-height:1.5}
    .checkout-btn{width:100%;padding:1.1rem;background:var(--plum);color:var(--white);border:none;font-family:'Poppins',sans-serif;font-size:0.85rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;transition:background 0.2s,transform 0.2s;margin-bottom:0.8rem}
    .checkout-btn:hover{background:var(--dark);transform:translateY(-1px)}
    .continue-btn{width:100%;padding:1rem;background:transparent;color:var(--dark);border:2px solid rgba(74,63,58,0.2);font-family:'Poppins',sans-serif;font-size:0.82rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:border-color 0.2s,color 0.2s}
    .continue-btn:hover{border-color:var(--plum);color:var(--plum)}
    .secure-badge{display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-top:1rem;font-size:0.72rem;color:var(--soft)}

    .footer{background:var(--dark);padding:2rem 0}
    .footer-bottom{display:flex;justify-content:center}
    .footer-copy{font-size:0.72rem;color:rgba(250,247,242,0.28)}
    .footer-heart{color:var(--blush)}

    @media(max-width:900px){.cart-layout{grid-template-columns:1fr}.order-summary{position:static}}
    @media(max-width:600px){
      .nav-links{display:none}
      .nav-links.open{display:flex;flex-direction:column;position:fixed;top:62px;left:0;right:0;background:var(--ivory);padding:1.5rem 2rem;border-bottom:1px solid rgba(221,182,187,0.3);z-index:99}
      .hamburger{display:flex}
      .cart-item{grid-template-columns:70px 1fr auto}
      .item-img{width:70px;height:70px}
    }
  </style>
</head>
<body>

<nav class="nav" id="nav">
  <a href="../index.html" class="nav-logo">Nette<span>'s Corner</span></a>
  <ul class="nav-links" id="navLinks">
    <li><a href="../blog/about.html">About</a></li>
    <li><a href="../blog/blog.html">Blog</a></li>
    <li><a href="index.html">Shop</a></li>
    <li><a href="../index.html#newsletter" class="nav-cta">Join Community</a></li>
  </ul>
  <div class="hamburger" id="hamburger" onclick="toggleNav()"><span></span><span></span><span></span></div>
</nav>

<div class="page-header">
  <h1 class="page-title">Your <em>Cart</em></h1>
  <p class="page-sub" id="cartCount">Loading...</p>
</div>

<section class="cart-section">
  <div class="container">
    <div id="cartContent"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <p class="footer-copy">© 2025 Nette's Corner. Made with <span class="footer-heart">♥</span></p>
    </div>
  </div>
</footer>

<script>
const nav=document.getElementById('nav');
window.addEventListener('scroll',()=>nav.classList.toggle('scrolled',window.scrollY>40));
function toggleNav(){document.getElementById('navLinks').classList.toggle('open')}

function getCart(){return JSON.parse(localStorage.getItem('nc_cart')||'[]')}
function saveCart(cart){localStorage.setItem('nc_cart',JSON.stringify(cart))}

function calcSubtotal(cart){return cart.reduce((s,i)=>s+(i.price*i.qty),0)}

function changeQty(variantId,delta){
  const cart=getCart();
  const item=cart.find(i=>i.variantId===variantId);
  if(!item)return;
  item.qty=Math.max(1,Math.min(10,item.qty+delta));
  saveCart(cart);renderCart();
}

function removeItem(variantId){
  const cart=getCart().filter(i=>i.variantId!==variantId);
  saveCart(cart);renderCart();
}

function renderCart(){
  const cart=getCart();
  const content=document.getElementById('cartContent');
  const countEl=document.getElementById('cartCount');
  const total=cart.reduce((s,i)=>s+i.qty,0);
  countEl.textContent=total===0?'Your cart is empty':`${total} item${total!==1?'s':''} in your cart`;

  if(cart.length===0){
    content.innerHTML=`
      <div class="empty-cart">
        <div class="empty-icon">🛍</div>
        <div class="empty-title">Your cart is empty</div>
        <p class="empty-sub">Looks like you haven't added anything yet.</p>
        <a href="products.html" class="btn-primary">Continue Shopping</a>
      </div>`;
    return;
  }

  const subtotal=calcSubtotal(cart);

  content.innerHTML=`
    <div class="cart-layout">
      <div class="cart-items">
        ${cart.map(item=>`
          <div class="cart-item">
            <div class="item-img">
              <img src="${item.image}" alt="${item.title}" loading="lazy"/>
            </div>
            <div class="item-details">
              <div class="item-title">${item.title}</div>
              <div class="item-variant">${item.variantTitle||''}</div>
              <div class="item-qty-row">
                <button class="qty-btn" onclick="changeQty('${item.variantId}',-1)">−</button>
                <div class="qty-num">${item.qty}</div>
                <button class="qty-btn" onclick="changeQty('${item.variantId}',1)">+</button>
              </div>
            </div>
            <div class="item-price-col">
              <div class="item-price">$${(item.price*item.qty).toFixed(2)}</div>
              <button class="remove-btn" onclick="removeItem('${item.variantId}')">Remove</button>
            </div>
          </div>`).join('')}
      </div>
      <div class="order-summary">
        <div class="summary-title">Order Summary</div>
        <div class="summary-row"><span>Subtotal (${total} item${total!==1?'s':''})</span><span>$${subtotal.toFixed(2)}</span></div>
        <div class="summary-row"><span>Shipping</span><span>Calculated at checkout</span></div>
        <div class="summary-row total"><span class="label">Total</span><span class="value">$${subtotal.toFixed(2)}</span></div>
        <p class="shipping-note">🌍 Ships worldwide via Printify. Delivery estimated 5–10 business days.</p>
        <button class="checkout-btn" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
        <button class="continue-btn" onclick="window.location.href='products.html'">← Continue Shopping</button>
        <div class="secure-badge">🔒 Secure checkout powered by PayPal</div>
      </div>
    </div>`;
}

renderCart();
</script>
</body>
</html>
